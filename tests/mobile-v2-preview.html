<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POJIDMUSIC Mobile v2 Preview</title>
    <style>
        html, body, iframe {
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            overflow: hidden;
            background: #111;
        }
    </style>
</head>
<body>
    <iframe src="../index.html?mobile-v2-preview=1" title="POJIDMUSIC mobile preview"></iframe>
    <script>
        const frame = document.querySelector("iframe");
        frame.addEventListener("load", () => {
            frame.contentDocument.documentElement.classList.add(
                "mobile-device",
                "ios-device",
                "standalone-mode"
            );
        });
    </script>
</body>
</html>
