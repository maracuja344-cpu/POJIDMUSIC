<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="POJIDMUSIC"
    >

    <title>POJIDMUSIC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Шапка сайта -->

    <header class="header">
        <div class="logo">POJIDMUSIC</div>

        <div
            class="auth-controls"
            data-auth-ready="false"
        >
            <button
                class="auth-open-button"
                type="button"
                aria-haspopup="dialog"
                aria-controls="auth-modal"
                aria-label="Войти"
            >
                <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                >
                    <path d="M10 17l5-5-5-5"></path>
                    <path d="M15 12H3"></path>
                    <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path>
                </svg>
                <span class="auth-open-label">Войти</span>
            </button>

            <div class="auth-user-controls" hidden>
                <button
                    class="auth-profile-button"
                    type="button"
                    aria-haspopup="menu"
                    aria-expanded="false"
                    aria-controls="profile-menu"
                    aria-label="Открыть меню профиля"
                >
                    <svg
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                    >
                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>

                    <span class="auth-user-details">
                        <span class="auth-user-identity"></span>
                    </span>

                    <svg
                        class="auth-profile-chevron"
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                    >
                        <path d="m7 10 5 5 5-5"></path>
                    </svg>
                </button>

                <div
                    id="profile-menu"
                    class="profile-menu"
                    role="menu"
                    hidden
                >
                    <button
                        class="profile-menu-item"
                        type="button"
                        role="menuitem"
                        data-profile-action="profile"
                        disabled
                        title="Раздел профиля появится позже"
                    >
                        Профиль
                    </button>

                    <button
                        class="profile-menu-item"
                        type="button"
                        role="menuitem"
                        data-profile-action="tracks"
                        disabled
                        title="Раздел с треками появится позже"
                    >
                        Мои треки
                    </button>

                    <button
                        class="track-upload-open-button profile-menu-item"
                        type="button"
                        role="menuitem"
                        aria-haspopup="dialog"
                        aria-controls="track-upload-modal"
                        hidden
                    >
                        Загрузить трек
                    </button>

                    <span
                        class="auth-profile-note"
                        role="status"
                        hidden
                    ></span>

                    <div class="profile-menu-separator"></div>

                    <button
                        class="auth-sign-out-button profile-menu-item"
                        type="button"
                        role="menuitem"
                    >
                        Выйти
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div
        id="auth-modal"
        class="auth-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="auth-modal-title"
        hidden
    >
        <div class="auth-modal-backdrop" data-auth-close></div>

        <div class="auth-dialog">
            <div class="auth-dialog-header">
                <h2 id="auth-modal-title">Аккаунт</h2>

                <button
                    class="auth-close-button"
                    type="button"
                    aria-label="Закрыть окно авторизации"
                    data-auth-close
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M6 6L18 18M18 6L6 18"></path>
                    </svg>
                </button>
            </div>

            <div
                class="auth-tabs"
                role="tablist"
                aria-label="Режим авторизации"
            >
                <button
                    id="auth-login-tab"
                    class="auth-tab is-active"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="auth-login-panel"
                    data-auth-mode="login"
                >
                    Вход
                </button>

                <button
                    id="auth-signup-tab"
                    class="auth-tab"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="auth-signup-panel"
                    data-auth-mode="signup"
                >
                    Регистрация
                </button>
            </div>

            <p
                class="auth-message"
                role="status"
                aria-live="polite"
                hidden
            ></p>

            <div
                id="auth-login-panel"
                class="auth-panel"
                role="tabpanel"
                aria-labelledby="auth-login-tab"
            >
                <form class="auth-form auth-login-form">
                    <label for="auth-login-email">Email</label>
                    <input
                        id="auth-login-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                    <label for="auth-login-password">Пароль</label>
                    <input
                        id="auth-login-password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="auth-submit-button"
                        type="submit"
                    >
                        Войти
                    </button>
                </form>
            </div>

            <div
                id="auth-signup-panel"
                class="auth-panel"
                role="tabpanel"
                aria-labelledby="auth-signup-tab"
                hidden
            >
                <form class="auth-form auth-signup-form">
                    <label for="auth-signup-name">Имя</label>
                    <input
                        id="auth-signup-name"
                        name="display_name"
                        type="text"
                        autocomplete="name"
                        required
                    >

                    <label for="auth-signup-email">Email</label>
                    <input
                        id="auth-signup-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                    <label for="auth-signup-password">
                        Пароль
                    </label>
                    <input
                        id="auth-signup-password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <label for="auth-signup-password-repeat">
                        Повторите пароль
                    </label>
                    <input
                        id="auth-signup-password-repeat"
                        name="password_repeat"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        class="auth-submit-button"
                        type="submit"
                    >
                        Зарегистрироваться
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div
        id="track-upload-modal"
        class="track-upload-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="track-upload-modal-title"
        hidden
    >
        <div
            class="track-upload-backdrop"
            data-track-upload-close
        ></div>

        <div class="track-upload-dialog">
            <div class="track-upload-dialog-header">
                <div>
                    <p class="track-upload-eyebrow">Новый релиз</p>
                    <h2 id="track-upload-modal-title">
                        Загрузить трек
                    </h2>
                </div>

                <button
                    class="track-upload-close-button"
                    type="button"
                    aria-label="Закрыть окно загрузки трека"
                    data-track-upload-close
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M6 6L18 18M18 6L6 18"></path>
                    </svg>
                </button>
            </div>

            <p
                class="track-upload-message"
                role="status"
                aria-live="polite"
                hidden
            ></p>

            <form class="track-upload-form">
                <label for="track-upload-title">
                    Название трека
                </label>
                <input
                    id="track-upload-title"
                    name="title"
                    type="text"
                    maxlength="200"
                    autocomplete="off"
                    required
                >

                <label for="track-upload-artist">
                    Исполнитель
                </label>
                <input
                    id="track-upload-artist"
                    name="artist_name"
                    type="text"
                    maxlength="200"
                    autocomplete="name"
                    required
                >

                <label for="track-upload-description">
                    Описание
                    <span class="track-upload-optional">
                        необязательно
                    </span>
                </label>
                <textarea
                    id="track-upload-description"
                    name="description"
                    maxlength="2000"
                    rows="3"
                ></textarea>

                <label for="track-upload-release-type">
                    Тип релиза
                </label>
                <select
                    id="track-upload-release-type"
                    name="release_type"
                    required
                >
                    <option value="demo">Демо</option>
                    <option value="single" selected>Сингл</option>
                    <option value="album_track">Трек альбома</option>
                </select>

                <div class="track-upload-file-field">
                    <label for="track-upload-audio">
                        Аудиофайл
                    </label>
                    <input
                        id="track-upload-audio"
                        name="audio"
                        type="file"
                        accept=".mp3,.wav,.flac,audio/mpeg,audio/wav,audio/x-wav,audio/flac,audio/x-flac"
                        required
                    >
                    <p
                        class="track-upload-file-details"
                        data-track-upload-audio-details
                        aria-live="polite"
                    >
                        MP3, WAV или FLAC, не больше 50 MiB
                    </p>
                </div>

                <div class="track-upload-file-field">
                    <label for="track-upload-cover">
                        Обложка
                    </label>
                    <input
                        id="track-upload-cover"
                        name="cover"
                        type="file"
                        accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                        required
                    >
                    <p
                        class="track-upload-file-details"
                        data-track-upload-cover-details
                        aria-live="polite"
                    >
                        JPG, PNG или WebP, не больше 5 MiB
                    </p>

                    <div
                        class="track-upload-cover-preview"
                        hidden
                    >
                        <img
                            alt="Предпросмотр выбранной обложки"
                        >
                    </div>
                </div>

                <button
                    class="track-upload-submit-button"
                    type="submit"
                >
                    Загрузить трек
                </button>
            </form>
        </div>
    </div>


    <!-- Поиск -->

    <div class="search-wrap">
        <input
            class="search-input"
            type="search"
            placeholder="Найти трек или артиста..."
            aria-label="Поиск по трекам и артистам"
        >
    </div>


    <!-- Результаты поиска -->

    <section
        id="search-results"
        class="search-results"
    >
        <h2 class="section-title">
            РЕЗУЛЬТАТЫ ПОИСКА
        </h2>

        <div class="tracks-row search-results-list"></div>

        <p class="search-empty">
            Ничего не найдено
        </p>
    </section>


    <!-- Новинки -->

    <section
        id="new"
        class="name"
    >
        <h2 class="section-title">
            НОВИНКИ
        </h2>

        <div class="tracks-row"></div>
    </section>


    <!-- Все треки -->

    <section
        id="all-tracks"
        class="name"
    >
        <h2 class="section-title">
            ВСЕ ТРЕКИ
        </h2>

        <div class="tracks-row"></div>
    </section>


    <!-- Рекомендации -->

    <section
        id="recommendations"
        class="recommendations-section reveal-section"
    >
        <h2 class="section-title">
            РЕКОМЕНДУЕМ
        </h2>

        <div class="recommendations-viewport">
            <div class="recommendations-track"></div>
        </div>
    </section>


    <!-- Мини-плеер -->

    <div class="mini-player">

        <!-- Мини-плеер:Полоса прогресса -->
        <div class="player-progress">
            <div class="player-progress-track">
                <div class="player-progress-fill"></div>
                <div class="player-progress-thumb"></div>
            </div>
        </div>


        <!-- Мини-плеер:Информация о треке -->

        <div class="player-main">
            <img
                class="player-cover"
                src=""
                alt="Обложка трека"
            >

            <div class="player-info">
                <div class="player-title">
                    Название
                </div>

                <div class="player-artist">
                    Артист
                </div>
            </div>
        </div>


        <!-- Мини-плеер:Кнопки управления -->

        <div class="player-controls">

            <button
                class="player-mode-button player-shuffle"
                type="button"
                data-player-mode="shuffle"
                aria-label="Включить перемешивание"
                aria-pressed="false"
                title="Перемешивание выключено"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M4 7H7.5C9 7 10.2 7.7 11.1 9L15.9 16C16.8 17.3 18 18 19.5 18H21M18 15L21 18L18 21M4 18H7.5C9 18 10.2 17.3 11.1 16L15.9 9C16.8 7.7 18 7 19.5 7H21M18 4L21 7L18 10"
                    ></path>
                </svg>
            </button>


            <button
                class="player-prev"
                aria-label="Предыдущий трек"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M6 5v14M18 6l-9 6 9 6V6z"/>
                </svg>
            </button>


            <button
                class="player-toggle"
                aria-label="Воспроизведение"
            ></button>


            <button
                class="player-next"
                aria-label="Следующий трек"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M18 5v14M6 6l9 6-9 6V6z"/>
                </svg>
            </button>


            <button
                class="player-mode-button player-repeat"
                type="button"
                data-player-mode="repeat"
                aria-label="Повтор выключен"
                aria-pressed="false"
                title="Повтор выключен"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M17 2L21 6L17 10M3 11V9C3 7.3 4.3 6 6 6H21M7 22L3 18L7 14M21 13V15C21 16.7 19.7 18 18 18H3"
                    ></path>
                </svg>

                <span
                    class="repeat-one-indicator"
                    aria-hidden="true"
                >1</span>
            </button>

        </div>


        <!-- Мини-плеер:Громкость и время -->

        <div class="volume-control">

            <button
                class="volume-button"
                aria-label="Громкость"
                aria-expanded="false"
            >
                <svg
                    class="volume-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M4 9v6h4l5 4V5L8 9H4z"/>

                    <path
                        class="volume-wave"
                        d="M16 8.5c1.3 1.1 1.3 5.9 0 7"
                    />

                    <path
                        class="volume-wave"
                        d="M18.5 6c3.3 3.3 3.3 8.7 0 12"
                    />
                </svg>
            </button>


            <div class="volume-slider-wrapper">
                <input
                    class="volume-slider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.1"
                    aria-label="Уровень громкости"
                >
            </div>


            <div class="player-time">
                <span class="current-time">0:00</span>
                <span class="time-separator">/</span>
                <span class="duration-time">0:00</span>
            </div>

        </div>

    </div>

<!-- =====================================================
     ПОЛНОЭКРАННЫЙ ПЛЕЕР
     ===================================================== -->

<!--
Этот экран будет открываться при нажатии
на обложку трека в нижнем мини-плеере.

Сейчас он скрыт через CSS.
Позже player.js будет добавлять ему класс open.
-->
<section
    class="fullscreen-player"
    aria-hidden="true"


    
>
    <!--
    Затемнённый фон.

    Позже мы сможем использовать на нём
    размытую обложку текущего трека.
    -->
    <div class="fullscreen-player-background"></div>


    <!-- =====================================================
     СВЕТОВЫЕ ЧАСТИЦЫ ФОНА
     ===================================================== -->

<div class="fullscreen-particles">
    <span class="fullscreen-particle particle-1"></span>
    <span class="fullscreen-particle particle-2"></span>
    <span class="fullscreen-particle particle-3"></span>
    <span class="fullscreen-particle particle-4"></span>
    <span class="fullscreen-particle particle-5"></span>
</div>


    <!-- Основное содержимое большого плеера -->
    <div class="fullscreen-player-content">

        <div class="fullscreen-player-desktop-actions">
            <button
                class="fullscreen-player-desktop-collapse"
                type="button"
                aria-label="Свернуть полноэкранный плеер"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M6 9L12 15L18 9"></path>
                </svg>
            </button>
        </div>

        <!-- Центральная часть -->
        <div class="fullscreen-player-cover-float">
            <div class="fullscreen-player-cover-interaction">
                <div class="fullscreen-player-cover-wrap">

                    <img
                        class="fullscreen-player-cover"
                        src="img/cover.jpg"
                        alt=""
                    >

                    <img
                        class="fullscreen-player-cover-next"
                        src="img/cover.jpg"
                        alt=""
                        aria-hidden="true"
                    >

                </div>
            </div>
        </div>


            <!-- Название и исполнитель -->
            <div class="fullscreen-player-info">

                <h2 class="fullscreen-player-title">
                    Название трека
                </h2>

                <p class="fullscreen-player-artist">
                    Исполнитель
                </p>

            </div>


            <!-- Прогресс трека -->
            <div class="fullscreen-player-progress-area">

                <!-- Кликабельная полоса прогресса -->
                <div class="fullscreen-player-progress">
                    <div class="fullscreen-player-progress-track">
                        <!-- Заполненная часть полосы -->
                        <div
                            class="fullscreen-player-progress-fill"
                        ></div>

                        <div
                            class="fullscreen-player-progress-thumb"
                            aria-hidden="true"
                        ></div>
                    </div>
                </div>


                <!-- Текущее время и длительность -->
                <div class="fullscreen-player-time">

                    <span
                        class="fullscreen-current-time"
                    >
                        0:00
                    </span>

                    <span
                        class="fullscreen-duration-time"
                    >
                        0:00
                    </span>

                </div>

            </div>


            <!-- Кнопки управления -->
            <div class="fullscreen-player-controls">

                <button
                    class="player-mode-button fullscreen-player-shuffle"
                    type="button"
                    data-player-mode="shuffle"
                    aria-label="Включить перемешивание"
                    aria-pressed="false"
                    title="Перемешивание выключено"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M4 7H7.5C9 7 10.2 7.7 11.1 9L15.9 16C16.8 17.3 18 18 19.5 18H21M18 15L21 18L18 21M4 18H7.5C9 18 10.2 17.3 11.1 16L15.9 9C16.8 7.7 18 7 19.5 7H21M18 4L21 7L18 10"
                        ></path>
                    </svg>
                </button>


                <!-- Предыдущий трек -->
                <button
                    class="fullscreen-player-prev"
                    type="button"
                    aria-label="Предыдущий трек"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M6 5V19M18 6L9 12L18 18V6Z"
                        ></path>
                    </svg>
                </button>


                <!-- Play / Pause -->
                <button
                    class="fullscreen-player-toggle"
                    type="button"
                    aria-label="Воспроизвести или поставить на паузу"
                >
                    <!-- Иконка Play -->
                    <svg
                        class="fullscreen-play-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M8 5V19L19 12L8 5Z"
                        ></path>
                    </svg>

                    <!-- Иконка Pause -->
                    <svg
                        class="fullscreen-pause-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M7 5H10V19H7V5ZM14 5H17V19H14V5Z"
                        ></path>
                    </svg>
                </button>


                <!-- Следующий трек -->
                <button
                    class="fullscreen-player-next"
                    type="button"
                    aria-label="Следующий трек"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M18 5V19M6 6L15 12L6 18V6Z"
                        ></path>
                    </svg>
                </button>


                <button
                    class="player-mode-button fullscreen-player-repeat"
                    type="button"
                    data-player-mode="repeat"
                    aria-label="Повтор выключен"
                    aria-pressed="false"
                    title="Повтор выключен"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M17 2L21 6L17 10M3 11V9C3 7.3 4.3 6 6 6H21M7 22L3 18L7 14M21 13V15C21 16.7 19.7 18 18 18H3"
                        ></path>
                    </svg>

                    <span
                        class="repeat-one-indicator"
                        aria-hidden="true"
                    >1</span>
                </button>

                <div class="fullscreen-volume-control">
                    <input
                        class="volume-slider fullscreen-volume-slider"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.1"
                        aria-label="Громкость fullscreen-плеера"
                    >
                </div>

            </div>

        </div>
</section>


    <!-- Данные треков -->

    <script src="tracks.js"></script>

    <!-- Запуск приложения -->

    <script
        type="module"
        src="js/script.js"
    ></script>

</body>
</html>
